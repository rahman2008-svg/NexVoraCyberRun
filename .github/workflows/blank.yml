name: NexVora CyberRun Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          godot --version

      - name: Create Build Directory
        run: mkdir -p build

      - name: Build Debug APK
        run: |
          godot --headless --path . \
            --export-debug "Android" \
            build/NexVoraCyberRun.apk

      - name: Verify APK
        run: test -s build/NexVoraCyberRun.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexVoraCyberRun-Android-APK
          path: build/NexVoraCyberRun.apk
          if-no-files-found: error
          retention-days: 14
          
