name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot Export Templates
        shell: bash
        run: |
          set -eux

          VERSION="4.4.1"
          mkdir -p godot-templates

          URL="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"

          echo "Downloading Godot ${VERSION} export templates..."

          wget -q --show-progress \
            --tries=5 \
            --timeout=60 \
            "$URL" \
            -O godot-templates/templates.tpz

          test -s godot-templates/templates.tpz

          echo "Template downloaded successfully:"
          ls -lh godot-templates/templates.tpz

      - name: Prepare Godot Container
        run: |
          set -eux

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          tar -xf godot-templates/templates.tpz \
            -C "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          echo "Templates extracted:"
          find "$HOME/.local/share/godot/export_templates/4.4.1.stable" \
            -maxdepth 3 -type f | head -30

      - name: Install Android Dependencies
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            openjdk-17-jdk \
            wget

          java -version

      - name: Validate Project
        uses: addnab/docker-run-action@v3
        with:
          image: barichello/godot-ci:4.4.1
          options: >-
            -v ${{ github.workspace }}:/workspace
            -w /workspace
          run: |
            set -eux
            godot --version
            test -f project.godot
            godot --headless --editor --quit

      - name: Export Android APK
        uses: addnab/docker-run-action@v3
        with:
          image: barichello/godot-ci:4.4.1
          options: >-
            -v ${{ github.workspace }}:/workspace
            -w /workspace
          run: |
            set -eux

            mkdir -p build

            echo "Godot:"
            godot --version

            echo "Project:"
            test -f project.godot

            echo "Export presets:"
            grep -n "Android" export_presets.cfg || true

            godot --headless \
              --path /workspace \
              --export-debug "Android" \
              /workspace/build/NexVoraCyberRun-debug.apk

            test -f /workspace/build/NexVoraCyberRun-debug.apk

            ls -lh /workspace/build/NexVoraCyberRun-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVoraCyberRun-Android
          path: build/NexVoraCyberRun-debug.apk
