name: NexVora CyberRun Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Android Environment
        run: |
          godot --version
          java -version
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$HOME/.local/share/godot/export_templates" \
            -maxdepth 2 -type f 2>/dev/null | head -20

      - name: Install Android SDK if needed
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is missing"
            exit 1
          fi
          ls "$ANDROID_HOME"

      - name: Configure Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Check Godot Project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          mkdir -p build
          godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          godot --headless --path . \
            --export-debug "Android" \
            build/NexVoraCyberRun.apk

      - name: Verify APK
        run: test -s build/NexVoraCyberRun.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVoraCyberRun-APK
          path: build/NexVoraCyberRun.apk
          if-no-files-found: error
          retention-days: 14
