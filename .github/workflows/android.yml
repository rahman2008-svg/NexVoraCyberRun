name: NexVora CyberRun APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android environment
        shell: bash
        run: |
          set -eux
          echo "Java:"
          java -version
          echo "SDK:"
          find / -name sdkmanager -type f 2>/dev/null | head
          echo "Godot:"
          godot --version

      - name: Install export templates
        shell: bash
        run: |
          set -eux
          DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          wget -q \
            https://downloads.tuxfamily.org/godotengine/4.4.1/Godot_v4.4.1-stable_export_templates.tpz \
            -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$DEST/"
          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"

      - name: Configure Android export
        shell: bash
        run: |
          set -eux

          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"

          SDKMANAGER="$(find / -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          ANDROID_HOME_DIR="$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")"

          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "$ANDROID_HOME_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "JAVA_HOME=$JAVA_HOME_DIR"
          echo "ANDROID_HOME=$ANDROID_HOME_DIR"

      - name: Validate project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          mkdir -p build
          godot --headless --editor --path . --quit

      - name: Export APK
        run: |
          godot --headless --path . \
            --export-debug "Android" \
            build/NexVoraCyberRun.apk

      - name: Verify APK
        run: test -s build/NexVoraCyberRun.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVoraCyberRun-APK
          path: build/NexVoraCyberRun.apk
          if-no-files-found: error
          retention-days: 14
