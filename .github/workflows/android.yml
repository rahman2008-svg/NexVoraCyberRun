name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot Android Export Templates
        shell: bash
        run: |
          set -eux

          GODOT_VERSION="4.4.1"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          echo "Downloading:"
          echo "$URL"

          curl -fL --retry 5 --retry-delay 3 "$URL" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates
          tar -xf /tmp/templates.tpz -C /tmp/godot_templates

          find /tmp/godot_templates -type f | head -20

          TEMPLATE_ROOT="$(find /tmp/godot_templates -type d -name 'templates' | head -1)"

          if [ -z "$TEMPLATE_ROOT" ]; then
            echo "ERROR: Godot export templates were not found."
            find /tmp/godot_templates -maxdepth 4 -type f
            exit 1
          fi

          cp -r "$TEMPLATE_ROOT"/* "$TEMPLATE_DIR"/

          echo "Installed templates:"
          find "$TEMPLATE_DIR" -maxdepth 2 -type f

      - name: Check Project
        run: |
          set -eux
          godot --version
          test -f project.godot
          godot --headless --editor --quit

      - name: Export Android APK
        run: |
          set -eux

          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/NexVoraCyberRun-debug.apk

          test -f build/NexVoraCyberRun-debug.apk

          ls -lh build/NexVoraCyberRun-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVoraCyberRun-Android
          path: build/NexVoraCyberRun-debug.apk
