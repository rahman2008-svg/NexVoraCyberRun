name: NexVora CyberRun Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot Export Templates
        run: |
          set -eux

          VERSION="4.4.1"

          mkdir -p "$GITHUB_WORKSPACE/godot-templates"

          URL="https://github.com/godotengine/godot-builds/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"

          wget \
            --tries=5 \
            --timeout=60 \
            "$URL" \
            -O "$GITHUB_WORKSPACE/godot-templates/templates.tpz"

          test -s "$GITHUB_WORKSPACE/godot-templates/templates.tpz"

          file "$GITHUB_WORKSPACE/godot-templates/templates.tpz"

      - name: Extract Export Templates
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/godot-templates/extracted"

          unzip -q \
            "$GITHUB_WORKSPACE/godot-templates/templates.tpz" \
            -d "$GITHUB_WORKSPACE/godot-templates/extracted"

          find "$GITHUB_WORKSPACE/godot-templates/extracted" \
            -maxdepth 3 \
            -type f \
            -print

      - name: Check Project
        run: |
          set -eux
          test -f project.godot
          test -f export_presets.cfg

      - name: Build Android APK
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/build"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e HOME=/github/home \
            barichello/godot-ci:4.4.1 \
            bash -lc '
              set -eux

              echo "Godot version:"
              godot --version

              echo "Java:"
              java -version

              echo "Project:"
              test -f project.godot

              echo "Export presets:"
              test -f export_presets.cfg

              mkdir -p /github/home/.local/share/godot/export_templates/4.4.1.stable

              TEMPLATE_ROOT=$(find /workspace/godot-templates/extracted \
                -type d \
                -name templates \
                | head -1)

              if [ -z "$TEMPLATE_ROOT" ]; then
                echo "ERROR: templates directory not found"
                find /workspace/godot-templates/extracted -maxdepth 4 -type f
                exit 1
              fi

              cp -r "$TEMPLATE_ROOT"/. \
                /github/home/.local/share/godot/export_templates/4.4.1.stable/

              echo "Installed templates:"
              find /github/home/.local/share/godot/export_templates/4.4.1.stable \
                -maxdepth 2 \
                -type f

              mkdir -p /github/home/.android

              keytool -genkeypair -noprompt \
                -keystore /github/home/.android/debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"

              mkdir -p /github/home/.config/godot

              cat > /github/home/.config/godot/editor_settings-4.tres <<SETTINGS
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/debug_keystore = "/github/home/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
SETTINGS

              godot --headless \
                --path /workspace \
                --editor \
                --quit

              godot --headless \
                --path /workspace \
                --export-debug "Android" \
                /workspace/build/NexVoraCyberRun-debug.apk

              test -s /workspace/build/NexVoraCyberRun-debug.apk

              ls -lh /workspace/build/NexVoraCyberRun-debug.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVoraCyberRun-Android
          path: build/NexVoraCyberRun-debug.apk
          if-no-files-found: error
          retention-days: 14
