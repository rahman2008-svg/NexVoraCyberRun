workflows:
  nexvora-cyberrun-android:
    name: NexVora CyberRun Android APK
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:

      - name: Install Godot 4.4.1
        script: |
          set -eux

          GODOT_VERSION="4.4.1"
          GODOT_DIR="$HOME/godot"

          mkdir -p "$GODOT_DIR"

          curl -L --fail --retry 5 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" \
            -o /tmp/godot.zip

          unzip -q -o /tmp/godot.zip -d "$GODOT_DIR"

          GODOT_BIN=$(find "$GODOT_DIR" \
            -type f \
            -name "Godot.app/Contents/MacOS/Godot" \
            | head -1)

          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$CM_ENV"

          "$GODOT_BIN" --version

      - name: Check project
        script: |
          set -eux

          test -f project.godot
          test -f export_presets.cfg

          "$GODOT_BIN" --version

      - name: Install Android export templates
        script: |
          set -eux

          GODOT_VERSION="4.4.1"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          curl -L --fail --retry 5 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          unzip -q -o /tmp/templates.tpz -d /tmp/templates

          TEMPLATE_ROOT=$(find /tmp/templates -type d -name templates | head -1)

          test -n "$TEMPLATE_ROOT"

          cp -r "$TEMPLATE_ROOT"/. "$TEMPLATE_DIR"/

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Prepare debug keystore
        script: |
          set -eux

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$HOME/.android/debug.keystore"

      - name: Validate Godot project
        script: |
          set -eux

          "$GODOT_BIN" \
            --headless \
            --path "$CM_BUILD_DIR" \
            --editor \
            --quit

      - name: Build Android APK
        script: |
          set -eux

          mkdir -p "$CM_BUILD_DIR/builds"

          "$GODOT_BIN" \
            --headless \
            --path "$CM_BUILD_DIR" \
            --export-debug \
            "Android" \
            "$CM_BUILD_DIR/builds/NexVoraCyberRun-debug.apk"

          test -s "$CM_BUILD_DIR/builds/NexVoraCyberRun-debug.apk"

          ls -lh "$CM_BUILD_DIR/builds/NexVoraCyberRun-debug.apk"

    artifacts:
      - builds/NexVoraCyberRun-debug.apk
