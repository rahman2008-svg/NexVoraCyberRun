workflows:
  nexvora-cyberrun-android:
    name: NexVora CyberRun Android APK
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Check project
        script: |
          set -eux

          echo "=== Project ==="
          test -f project.godot

          echo "=== Export preset ==="
          test -f export_presets.cfg

          echo "=== Godot ==="
          godot --version

      - name: Install Android export templates
        script: |
          set -eux

          GODOT_VERSION="4.4.1"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          TEMPLATE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          echo "Downloading Godot export templates..."
          curl -L --fail --retry 5 \
            "$TEMPLATE_URL" \
            -o /tmp/godot_templates.tpz

          test -s /tmp/godot_templates.tpz

          echo "Extracting templates..."
          unzip -q -o \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_ROOT=$(find /tmp/godot_templates \
            -type d \
            -name templates \
            | head -1)

          test -n "$TEMPLATE_ROOT"

          cp -r "$TEMPLATE_ROOT"/. "$TEMPLATE_DIR"/

          echo "Installed templates:"
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -print

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android SDK
        script: |
          set -eux

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Android debug keystore
        script: |
          set -eux

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$HOME/.android/debug.keystore"

      - name: Validate Godot project
        script: |
          set -eux

          godot \
            --headless \
            --path "$CM_BUILD_DIR" \
            --editor \
            --quit

      - name: Build Android debug APK
        script: |
          set -eux

          mkdir -p "$CM_BUILD_DIR/builds"

          godot \
            --headless \
            --path "$CM_BUILD_DIR" \
            --export-debug \
            "Android" \
            "$CM_BUILD_DIR/builds/NexVoraCyberRun-debug.apk"

          test -s "$CM_BUILD_DIR/builds/NexVoraCyberRun-debug.apk"

          ls -lh "$CM_BUILD_DIR/builds/NexVoraCyberRun-debug.apk"

    artifacts:
      - builds/NexVoraCyberRun-debug.apk
      - builds/**/*.apk

